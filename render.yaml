services:
  - type: web
    name: finite-field-lab
    runtime: python
    plan: free
    rootDir: Polynomial-Arithmetic-main/Polynomial-Arithmetic-main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
